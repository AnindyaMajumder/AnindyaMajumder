<style>
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}
.lbl{fill:#39c5cf;font-weight:700}
.br{fill:#e6edf3;font-weight:700}
.host{fill:#39c5cf;font-weight:700}
.hd{fill:#0d1117;font-weight:700}
.dim{fill:var(--ink,#8b949e)}
.tree{fill:var(--ink,#484f58)}
.fg{fill:var(--ink,#c9d1d9)}
.hi{fill:var(--ink,#e6edf3);font-weight:700}
.ok{fill:var(--ink,#3fb950);font-weight:700}
/* 3 stacked variants, exactly one visible at a time */
.v{animation:v var(--d,2.4s) linear infinite}
.v1{opacity:0;animation-delay:calc(var(--d,2.4s) / -3)}
.v2{opacity:0;animation-delay:calc(var(--d,2.4s) / -1.5)}
@keyframes v{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.v{animation:none}}
</style>
