<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
<title>anindya@dhaka — htop</title>
<style>
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}
.lbl{fill:#39c5cf;font-weight:700}
.br{fill:#e6edf3;font-weight:700}
.host{fill:#39c5cf;font-weight:700}
.hd{fill:#0d1117;font-weight:700}
.dim{fill:var(--ink,#8b949e)}
.fg{fill:var(--ink,#c9d1d9)}
.hi{fill:var(--ink,#e6edf3);font-weight:700}
.ok{fill:var(--ink,#3fb950);font-weight:700}
.bad{fill:var(--ink,#f85149);font-weight:700}
/* 3 stacked variants, exactly one visible at a time */
.v{animation:v var(--d,2.4s) linear infinite}
.v1{opacity:0;animation-delay:calc(var(--d,2.4s) / -3)}
.v2{opacity:0;animation-delay:calc(var(--d,2.4s) / -1.5)}
@keyframes v{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}
.blink{animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.v,.blink{animation:none}}
</style>
<defs>
  <pattern id="tick" width="5" height="10" patternUnits="userSpaceOnUse"><rect width="2.4" height="10" fill="#fff"/></pattern>
  <mask id="bars"><rect x="64" y="20" width="240" height="64" fill="url(#tick)"/></mask>
  <clipPath id="sel"><rect x="12" y="121" width="696" height="20"><animateTransform attributeName="transform" type="translate" values="0 0;0 20;0 40;0 60;0 80;0 100" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>

  <g id="rows">
    <text x="72" y="136" text-anchor="end" class="fg">2024</text><text x="88" y="136" class="ok">R</text>
    <g style="--d:2.1s"><text x="150" y="136" text-anchor="end" class="fg v v0">42.0</text><text x="150" y="136" text-anchor="end" class="fg v v1">38.7</text><text x="150" y="136" text-anchor="end" class="fg v v2">45.3</text></g>
    <text x="168" y="136"><tspan class="hi">langgraph</tspan><tspan class="dim"> --agents=∞</tspan></text>

    <text x="72" y="156" text-anchor="end" class="fg">1337</text><text x="88" y="156" class="ok">R</text>
    <g style="--d:2.7s"><text x="150" y="156" text-anchor="end" class="fg v v0">23.1</text><text x="150" y="156" text-anchor="end" class="fg v v1">27.4</text><text x="150" y="156" text-anchor="end" class="fg v v2">19.8</text></g>
    <text x="168" y="156"><tspan class="hi">rag</tspan><tspan class="dim"> --retrieve --rerank</tspan></text>

    <text x="72" y="176" text-anchor="end" class="fg">5678</text><text x="88" y="176" class="ok">R</text>
    <g style="--d:3.3s"><text x="150" y="176" text-anchor="end" class="fg v v0">18.4</text><text x="150" y="176" text-anchor="end" class="fg v v1">16.0</text><text x="150" y="176" text-anchor="end" class="fg v v2">21.2</text></g>
    <text x="168" y="176"><tspan class="hi">n8n</tspan><tspan class="dim"> worker --flows=*</tspan></text>

    <text x="72" y="196" text-anchor="end" class="fg">8000</text><text x="88" y="196" class="ok">R</text>
    <g style="--d:1.8s"><text x="150" y="196" text-anchor="end" class="fg v v0">9.9</text><text x="150" y="196" text-anchor="end" class="fg v v1">12.3</text><text x="150" y="196" text-anchor="end" class="fg v v2">8.1</text></g>
    <text x="168" y="196"><tspan class="hi">fastapi</tspan><tspan class="dim"> run --workers=4</tspan></text>

    <text x="72" y="216" text-anchor="end" class="fg">6443</text><text x="88" y="216" class="dim">S</text>
    <g style="--d:3.9s"><text x="150" y="216" text-anchor="end" class="fg v v0">4.2</text><text x="150" y="216" text-anchor="end" class="fg v v1">6.8</text><text x="150" y="216" text-anchor="end" class="fg v v2">3.0</text></g>
    <text x="168" y="216"><tspan class="hi">kubectl</tspan><tspan class="dim"> apply -f prod/</tspan></text>

    <text x="72" y="236" text-anchor="end" class="fg">666</text><text x="88" y="236" class="bad blink">Z</text>
    <text x="150" y="236" text-anchor="end" class="fg">0.0</text>
    <text x="168" y="236"><tspan class="hi">sleep</tspan><tspan class="dim"> &lt;defunct&gt;</tspan></text>
  </g>
</defs>

<rect width="720" height="290" rx="10" fill="#0d1117"/>
<rect x=".5" y=".5" width="719" height="289" rx="10" fill="none" stroke="#30363d"/>

<!-- meters -->
<text x="24" y="36" class="lbl">CPU</text><text x="54" y="36" class="br">[</text><text x="346" y="36" class="br">]</text>
<text x="24" y="56" class="lbl">Mem</text><text x="54" y="56" class="br">[</text><text x="346" y="56" class="br">]</text>
<text x="24" y="76" class="lbl">Zzz</text><text x="54" y="76" class="br">[</text><text x="346" y="76" class="br">]</text>
<g mask="url(#bars)">
  <rect x="64" y="24" width="196" height="14" fill="#f85149"><animate attributeName="width" values="196;212;186;220;204;196" dur="3.2s" repeatCount="indefinite"/></rect>
  <rect x="64" y="24" width="180" height="14" fill="#3fb950"><animate attributeName="width" values="180;196;170;204;188;180" dur="3.2s" repeatCount="indefinite"/></rect>
  <rect x="64" y="44" width="158" height="14" fill="#d29922"><animate attributeName="width" values="158;166;161;158" dur="6s" repeatCount="indefinite"/></rect>
  <rect x="64" y="44" width="118" height="14" fill="#3fb950"><animate attributeName="width" values="118;126;121;118" dur="6s" repeatCount="indefinite"/></rect>
  <rect x="64" y="64" width="20" height="14" fill="#f85149"><animate attributeName="width" values="20;12;26;20" dur="5s" repeatCount="indefinite"/></rect>
</g>
<g style="--d:2.4s"><text x="344" y="36" text-anchor="end" class="dim v v0">97.0%</text><text x="344" y="36" text-anchor="end" class="dim v v1">88.1%</text><text x="344" y="36" text-anchor="end" class="dim v v2">93.4%</text></g>
<text x="344" y="56" text-anchor="end" class="dim">coffee/∞</text>
<text x="344" y="76" text-anchor="end" class="dim">3h/8h</text>

<text x="384" y="36" class="dim">Hostname: <tspan class="host">anindya@dhaka</tspan></text>
<text x="384" y="56" class="dim">Tasks: <tspan class="hi">6</tspan>, <tspan class="hi">1</tspan> zombie; <tspan class="ok">5</tspan> running</text>
<text x="384" y="76" class="dim">Uptime: <tspan class="hi">24/7</tspan></text>

<!-- process table -->
<rect x="12" y="98" width="696" height="19" fill="#3fb950"/>
<rect x="110" y="98" width="46" height="19" fill="#39c5cf"/>
<text x="72" y="112" text-anchor="end" class="hd">PID</text><text x="88" y="112" class="hd">S</text><text x="150" y="112" text-anchor="end" class="hd">CPU%</text><text x="168" y="112" class="hd">Command</text>

<use href="#rows"/>
<rect x="12" y="121" width="696" height="20" fill="#39c5cf"><animateTransform attributeName="transform" type="translate" values="0 0;0 20;0 40;0 60;0 80;0 100" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect>
<g clip-path="url(#sel)"><use href="#rows" style="--ink:#0d1117"/></g>

<!-- F-key bar -->
<text x="12" y="270" class="br" textLength="16.8">F1</text>
<rect x="29.6" y="256" width="96.4" height="19" fill="#39c5cf"/><text x="31.6" y="270" class="hd" textLength="92.4">anindya.pro</text>
<text x="134" y="270" class="br" textLength="16.8">F2</text>
<rect x="151.6" y="256" width="71.2" height="19" fill="#39c5cf"/><text x="153.6" y="270" class="hd" textLength="67.2">linkedin</text>
<text x="230.8" y="270" class="br" textLength="16.8">F3</text>
<rect x="248.4" y="256" width="54.4" height="19" fill="#39c5cf"/><text x="250.4" y="270" class="hd" textLength="50.4">github</text>
<text x="580.8" y="270" class="br" textLength="25.2">F10</text>
<rect x="607.6" y="256" width="100.4" height="19" fill="#39c5cf"/><text x="609.6" y="270" class="hd" textLength="92.4">touch grass</text>
</svg>
